<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendIQ - Login</title>
    <!-- HTML loads the CSS file for appearance and JavaScript for behavior. -->
    <link rel="stylesheet" href="login.css" />
    <!-- Supabase browser SDK; safe to expose because RLS protects the tables. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Load the public client before the local fallback store. -->
    <script src="../shared/supabase.js" defer></script>
    <!-- The shared store provides the accounts and sessions for login.js. -->
    <script src="../shared/store.js" defer></script>
    <!-- defer waits until HTML is parsed before running login.js. -->
    <!-- The async Supabase adapter is the only frontend module for backend calls. -->
    <script src="../shared/supabase-store.js" defer></script>

    <script src="login.js" defer></script>
  </head>
  <body>
    <!-- main container -->
    <div class="container">
      <!-- Login Form wrapper -->
      <div class="login-wrapper">
        <!-- Header Section -->
        <div class="login-header">
          <!-- class values are styling hooks used by login.css. -->
          <div class="brand">AttendIQ</div>
          <h1>Welcome back</h1>
          <p class="subtitle">Sign in with your AttendIQ account</p>
        </div>

        <!-- Error/Success Message -->
        <!-- JavaScript writes validation feedback into this element. -->
        <div id="message" class="message"></div>

        <!-- Login Form -->
        <!-- login.js listens for submit events on this form id. -->
        <form id="loginForm" class="login-form">
          <!-- Email/Username Field -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
            <span class="error-text" id="emailError"></span>
          </div>

          <!-- password field -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />

              <!-- login.js finds this button and changes the input type. -->
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Toggle password Visibility"
              >
                Show
              </button>
            </div>
          </div>

          <!-- Remember me checkbox -->
          <div class="login-options">
            <div class="form-group checkbox-group">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <label for="rememberMe">Remember me</label>
            </div>

            <!-- Forgot Password -->
            <div class="forgot-password">
              <a href="#forgot">Forgot password?</a>
            </div>
          </div>

          <!-- Submmit Button -->
          <button type="submit" class="login-button">Sign in</button>
        </form>

        <!-- Demo accounts: login.js fills the form when one is clicked. -->
        <div class="demo-accounts">
          <p class="demo-title">Demo accounts · click to auto-fill</p>
          <div class="demo-buttons" id="demoAccounts"></div>
        </div>
      </div>
    </div>
  </body>
</html>
