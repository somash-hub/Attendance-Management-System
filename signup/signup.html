<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendIQ - Student Registration</title>
    <link rel="stylesheet" href="signup.css" />
    <script src="signup.js" defer></script>
  </head>
  <body>
    <main class="container">
      <section class="login-wrapper">
        <header class="login-header">
          <div class="brand">AttendIQ</div>
          <!-- The classes style the tabs; disabled keeps future roles unavailable. -->
          <div class="role-tabs" role="tablist" aria-label="Account role">
            <button type="button" class="role-tab active">Student</button>
            <button type="button" class="role-tab" disabled>Teacher</button>
            <button type="button" class="role-tab" disabled>Admin</button>
          </div>
          <p class="eyebrow">Student Portal</p>
          <h1>Student Registration</h1>
          <p class="subtitle">
            Create your student account using TU credentials
          </p>
        </header>
        <div id="message" class="message" role="status"></div>
        <form id="signupForm" class="login-form">
          <div class="steps">
            <span class="step active">1 <small>TU Details</small></span
            ><span class="step">2 <small>Personal Info</small></span
            ><span class="step">3 <small>Account</small></span>
          </div>
          <div class="signup-step active" data-step="1">
            <div class="form-group">
              <label for="name">Full Name *</label
              ><input
                type="text"
                id="name"
                placeholder="As per TU registration"
                required
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="registration">TU Registration No. *</label
                ><input
                  id="registration"
                  placeholder="12345/075"
                  required
                /><small>Format: RegNo/Year</small>
              </div>
              <div class="form-group">
                <label for="symbol">TU Symbol No. *</label
                ><input
                  id="symbol"
                  inputmode="numeric"
                  maxlength="8"
                  placeholder="40123456"
                  required
                /><small>8-digit number</small>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="department">Department *</label
                ><select id="department" required>
                  <option>CSE</option>
                  <option>ECE</option>
                  <option>ME</option>
                  <option>Civil</option>
                  <option>IT</option>
                  <option>MBA</option>
                </select>
              </div>
              <div class="form-group">
                <label for="semester">Semester *</label
                ><select id="semester" required>
                  <option>1st</option>
                  <option>2nd</option>
                  <option>3rd</option>
                  <option>4th</option>
                  <option>5th</option>
                  <option>6th</option>
                  <option selected>7th</option>
                  <option>8th</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="email">College-issued Email *</label
              ><input
                type="email"
                id="email"
                placeholder="firstname.symbolno@student.tu.edu.np"
                required
              /><small>Must end with @student.tu.edu.np</small>
            </div>
          </div>
          <div class="signup-step" data-step="2">
            <div class="form-group">
              <label for="phone">Phone number *</label
              ><input type="tel" id="phone" placeholder="98XXXXXXXX" required />
            </div>
            <div class="form-group">
              <label for="address">Address *</label
              ><input
                id="address"
                placeholder="Your current address"
                required
              />
            </div>
          </div>
          <div class="signup-step" data-step="3">
            <div class="form-group">
              <label for="password">Password *</label
              ><input
                type="password"
                id="password"
                placeholder="At least 8 characters"
                required
              />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm password *</label
              ><input
                type="password"
                id="confirmPassword"
                placeholder="Repeat your password"
                required
              />
            </div>
          </div>
          <div class="step-actions">
            <button
              type="button"
              id="backButton"
              class="secondary-button"
              hidden
            >
              ← Previous step</button
            ><button type="button" id="continueButton" class="login-button">
              Continue
            </button>
          </div>
        </form>
        <div class="signup-link">
          <p>
            Already have an account? <a href="../login/login.html">Log in</a>
          </p>
        </div>
        <a class="back-home" href="../login/login.html">← Back to home</a>
      </section>
    </main>
  </body>
</html>
