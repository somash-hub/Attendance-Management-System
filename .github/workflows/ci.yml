name: Validate AttendIQ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate JavaScript and frontend secrets
        run: npm run check
      - name: Check Edge Functions
        run: deno check supabase/functions/admin-create-user/index.ts supabase/functions/admin-update-faculty/index.ts supabase/functions/admin-delete-user/index.ts supabase/functions/upload-leave-document/index.ts
